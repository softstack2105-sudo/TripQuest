<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TripQuest Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
            padding: 25px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        /* REFRESH BUTTON */

        .refresh-btn {
            display: block;
            margin: 20px auto 30px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            opacity: 0.8;
        }

        /* STATUS */

        #status {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        /* TOP CARDS */

        .top-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 35px;
            font-weight: bold;
        }

        /* SECTIONS */

        .section {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* RESULTS */

        .result-item {
            margin-bottom: 20px;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .bar-background {
            width: 100%;
            height: 14px;
            background: #e9edf3;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: #222;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        /* VOTE TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        .vote-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .vote-table th,
        .vote-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .vote-table th {
            background: #f1f3f7;
            font-size: 14px;
        }

        .vote-table td {
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            color: #888;
            margin-top: 30px;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 27px;
            }

            .top-cards {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>🎒 TripQuest Admin</h1>

        <p>
            Sangli Trip • 18–20 October 2026
        </p>

    </div>


    <!-- REFRESH -->

    <button
        class="refresh-btn"
        onclick="loadVotes()">

        🔄 Refresh Votes

    </button>


    <!-- STATUS -->

    <div id="status">
        Loading votes...
    </div>


    <!-- STATISTICS -->

    <div class="top-cards">


        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <h3>
                Total Votes
            </h3>

            <div
                class="stat-number"
                id="totalVotes">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📅
            </div>

            <h3>
                Dates Chosen
            </h3>

            <div
                class="stat-number"
                id="dateOptions">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🎮
            </div>

            <h3>
                Activities
            </h3>

            <div
                class="stat-number"
                id="activityOptions">

                0

            </div>

        </div>


    </div>


    <!-- DATE RESULTS -->

    <div class="section">

        <h2>
            📅 Date Preferences
        </h2>

        <div id="dateResults">

            <p class="empty">
                Loading...
            </p>

        </div>

    </div>


    <!-- ACTIVITY RESULTS -->

    <div class="section">

        <h2>
            🎮 Adventure Preferences
        </h2>

        <div id="activityResults">

            <p class="empty">
                Loading...
            </p>

        </div>

    </div>


    <!-- ALL VOTES -->

    <div class="section">

        <h2>
            📋 All Votes
        </h2>


        <div class="table-wrapper">

            <table class="vote-table">

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Adventure
                        </th>

                        <th>
                            Submitted
                        </th>

                    </tr>

                </thead>


                <tbody id="votesList">

                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">

        TripQuest • Organizer Dashboard

    </div>


</div>



<script>


// =========================================
// LOAD VOTES
// =========================================

async function loadVotes() {

    const status =
        document.getElementById("status");

    status.textContent =
        "⏳ Loading votes...";


    try {

        const response =
            await fetch("/api/votes");


        if (!response.ok) {

            throw new Error(
                "Failed to load votes"
            );

        }


        const votes =
            await response.json();


        console.log(
            "Votes received:",
            votes
        );


        displayDashboard(votes);


        status.textContent =
            "✅ Dashboard updated successfully";


    } catch (error) {

        console.error(error);


        status.textContent =
            "❌ Could not load votes. Make sure the server is running.";

    }

}



// =========================================
// DISPLAY DASHBOARD
// =========================================

function displayDashboard(votes) {


    // -------------------------------------
    // TOTAL VOTES
    // -------------------------------------

    document.getElementById(
        "totalVotes"
    ).textContent = votes.length;


    // -------------------------------------
    // DATE COUNTS
    // -------------------------------------

    const dateCounts = {};


    votes.forEach(function(vote) {

        const date =
            vote.selected_date;


        if (!dateCounts[date]) {

            dateCounts[date] = 0;

        }


        dateCounts[date]++;

    });


    // Number of date options selected

    document.getElementById(
        "dateOptions"
    ).textContent =
        Object.keys(dateCounts).length;



    // -------------------------------------
    // DISPLAY DATE RESULTS
    // -------------------------------------

    const dateResults =
        document.getElementById(
            "dateResults"
        );


    dateResults.innerHTML = "";


    if (votes.length === 0) {

        dateResults.innerHTML =
            '<p class="empty">No votes yet.</p>';

    } else {

        Object.keys(dateCounts).forEach(
            function(date) {

                const count =
                    dateCounts[date];


                const percentage =
                    (count / votes.length) * 100;


                dateResults.innerHTML += `

                    <div class="result-item">

                        <div class="result-title">

                            <span>
                                📅 ${date}
                            </span>

                            <strong>
                                ${count} vote(s)
                            </strong>

                        </div>

                        <div class="bar-background">

                            <div
                                class="bar"
                                style="width: ${percentage}%">

                            </div>

                        </div>

                    </div>

                `;

            }
        );

    }



    // -------------------------------------
    // ACTIVITY COUNTS
    // -------------------------------------

    const activityCounts = {};


    votes.forEach(function(vote) {

        const activity =
            vote.activity;


        if (!activityCounts[activity]) {

            activityCounts[activity] = 0;

        }


        activityCounts[activity]++;

    });


    // Number of activities selected

    document.getElementById(
        "activityOptions"
    ).textContent =
        Object.keys(activityCounts).length;



    // -------------------------------------
    // DISPLAY ACTIVITY RESULTS
    // -------------------------------------

    const activityResults =
        document.getElementById(
            "activityResults"
        );


    activityResults.innerHTML = "";


    if (votes.length === 0) {

        activityResults.innerHTML =
            '<p class="empty">No votes yet.</p>';

    } else {

        Object.keys(activityCounts).forEach(
            function(activity) {

                const count =
                    activityCounts[activity];


                const percentage =
                    (count / votes.length) * 100;


                activityResults.innerHTML += `

                    <div class="result-item">

                        <div class="result-title">

                            <span>
                                🎮 ${activity}
                            </span>

                            <strong>
                                ${count} vote(s)
                            </strong>

                        </div>

                        <div class="bar-background">

                            <div
                                class="bar"
                                style="width: ${percentage}%">

                            </div>

                        </div>

                    </div>

                `;

            }
        );

    }



    // -------------------------------------
    // ALL VOTES TABLE
    // -------------------------------------

    const votesList =
        document.getElementById(
            "votesList"
        );


    votesList.innerHTML = "";


    if (votes.length === 0) {

        votesList.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    No votes yet.

                </td>

            </tr>

        `;

        return;

    }



    votes.forEach(function(vote) {


        let submitted =
            vote.created_at || "-";


        // Format date/time

        if (submitted !== "-") {

            submitted =
                new Date(submitted)
                    .toLocaleString();

        }


        votesList.innerHTML += `

            <tr>

                <td>
                    👤 ${vote.name}
                </td>

                <td>
                    📅 ${vote.selected_date}
                </td>

                <td>
                    🎮 ${vote.activity}
                </td>

                <td>
                    ${submitted}
                </td>

            </tr>

        `;

    });

}



// =========================================
// LOAD DASHBOARD WHEN PAGE OPENS
// =========================================

loadVotes();


</script>


</body>

</html>
